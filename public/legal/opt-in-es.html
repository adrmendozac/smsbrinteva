<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recibir Actualizaciones por SMS — Brinteva Worlds Inc.</title>
  <link rel="stylesheet" href="/legal/legal.css">
  <link rel="alternate" hreflang="en" href="/legal/opt-in.html">
  <link rel="alternate" hreflang="es" href="/legal/opt-in-es.html">
</head>
<body>
  <a class="brand" href="https://brintevaworlds.com">
    <img src="/legal/logo.png" alt="Brinteva Worlds Inc." width="72" height="72">
  </a>
  <h1>Recibir Actualizaciones por SMS de Brinteva Worlds</h1>
  <p class="muted">Regístrese para recibir ofertas de viajes, actualizaciones de reservas y mensajes de atención al cliente por mensaje de texto.</p>

  <form id="optin">
    <label for="name">Nombre completo</label>
    <input type="text" id="name" name="name" autocomplete="name" required>

    <label for="phone">Número de teléfono móvil</label>
    <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="(555) 123-4567" required>

    <!-- Honeypot: hidden from users; bots tend to fill it. -->
    <div class="hp" aria-hidden="true">
      <label for="website">Website</label>
      <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
    </div>

    <div class="consent">
      <input type="checkbox" id="consent" name="consent" required>
      <label for="consent">
        Acepto recibir mensajes de texto automatizados recurrentes de marketing y atención al cliente de
        Brinteva Worlds Inc. en el número proporcionado. El consentimiento no es una condición de compra.
        Pueden aplicar tarifas de mensajes y datos. La frecuencia de los mensajes varía. Responda STOP para cancelar, HELP para obtener ayuda.
        Consulte nuestra <a href="/privacy">Política de Privacidad</a> y
        <a href="/sms-terms">Términos y Condiciones de SMS</a>.
      </label>
    </div>

    <button type="submit" id="submit">Suscribirme</button>
    <div id="status" role="status" aria-live="polite"></div>
  </form>

  <footer>
    &copy; 2026 Brinteva Worlds Inc. Todos los derechos reservados. &middot;
    <a href="/privacy">Política de Privacidad</a> &middot; <a href="/sms-terms">Términos y Condiciones de SMS</a>
  </footer>

  <script>
    const form = document.getElementById('optin');
    const statusEl = document.getElementById('status');
    const btn = document.getElementById('submit');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusEl.textContent = '';
      statusEl.className = '';
      if (!document.getElementById('consent').checked) {
        statusEl.textContent = 'Por favor, marque la casilla de consentimiento para continuar.';
        statusEl.className = 'err';
        return;
      }
      btn.disabled = true;
      const payload = {
        name: document.getElementById('name').value,
        phone: document.getElementById('phone').value,
        consent: document.getElementById('consent').checked,
        website: document.getElementById('website').value
      };
      try {
        const res = await fetch('/api/opt-in', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          form.reset();
          statusEl.textContent = "¡Estás suscrito! Revisa tu teléfono para un mensaje de confirmación.";
          statusEl.className = 'ok';
          btn.disabled = true;
        } else {
          statusEl.textContent = data.error || 'Algo salió mal, por favor intenta de nuevo.';
          statusEl.className = 'err';
          btn.disabled = false;
        }
      } catch (err) {
        statusEl.textContent = 'Error de red, por favor intenta de nuevo.';
        statusEl.className = 'err';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
